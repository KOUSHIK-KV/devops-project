
name: DevOps Project CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask application
        run: |
          python -c "from app.app import app; print('Flask application imported successfully')"

      - name: Build Docker image
        run: docker build -t devops-flask-app .

      - name: Diagnose GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import base64

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url = url + separator + "audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::914339263396:role/GitHubActionsECRPushPolicy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/devops-flask-app:$IMAGE_TAG .
          docker push $REGISTRY/devops-flask-app:$IMAGE_TAG

          docker tag $REGISTRY/devops-flask-app:$IMAGE_TAG $REGISTRY/devops-flask-app:latest
          docker push $REGISTRY/devops-flask-app:latest
